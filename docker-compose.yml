services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    volumes: ["rps-data:/app/data"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  rps-data:
